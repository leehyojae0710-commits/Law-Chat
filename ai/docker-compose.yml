services:
  ai:
    build: .
    container_name: law-chat-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./weights:/app/weights:ro       # LoRA 어댑터 (criminal_qa, administrative_qa, civil_qa)
      - ./indexes:/app/indexes:ro       # RAG FAISS+BM25 인덱스
      - ./kobart:/app/kobart:ro         # KoBART 판례요약 체크포인트
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
