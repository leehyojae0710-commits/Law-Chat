plugins {

	id 'java'
	id 'eclipse'   // ★ 추가: ./gradlew eclipse 로 .classpath/.project 를 UTF-8 설정과 함께 생성
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'

}

group = 'com.lawchat'
version = '0.0.1-SNAPSHOT'

java {

    toolchain {

        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ==================================================================
// ★★★ 한글 깨짐 해결의 핵심 ★★★
// 소스 파일은 UTF-8 로 저장돼 있는데, JDK 17 의 javac 는 -encoding 을 주지 않으면
// "플랫폼 기본 인코딩"(한글 Windows = MS949)으로 읽는다.
// 그래서 ErrorCode 의 "이미 사용 중인 이메일입니다." 같은 한글 리터럴이
// 컴파일 시점에 깨진 채로 .class 에 박히고, API 응답에도 깨져서 나간다.
// 아래 설정으로 컴파일/테스트/javadoc 전부 UTF-8 로 고정한다.
// ==================================================================
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// Eclipse 프로젝트 파일도 UTF-8 로 생성되도록
eclipse {
    classpath {
        defaultOutputDir = file('build/classes')
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Boot 4에서 spring-boot-starter-web은 spring-boot-starter-webmvc로 이름이 바뀌었다.
    // (starter-web은 당장 빌드가 깨지진 않지만 deprecated이므로 새 이름으로 맞춰준다)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ChatMessage/ChatSession 등 엔티티가 @Getter, @Builder, @NoArgsConstructor 를 쓰고 있어서
    // 이 두 줄이 없으면 그 엔티티들이 아예 컴파일되지 않는다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    // ★ 회원가입/로그인 직접 영향 지점 ★
    // jjwt-jackson은 내부적으로 Jackson 2(com.fasterxml.jackson) API로 직렬화한다.
    // Boot 4.1은 Jackson 3(tools.jackson)을 기본으로 쓰기 때문에, jjwt-jackson을 그대로 두면
    // 로그인/회원가입 시 토큰을 만들거나 검증하는 순간(JwtTokenProvider) 클래스 충돌로 500 에러가 난다.
    // Jackson에 의존하지 않는 jjwt-gson으로 바꿔서 이 충돌 자체를 없앤다.
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
