spring:
  application:
    name: backend
  datasource:
    # law_chat
    url: jdbc:mysql://localhost:3306/law_chat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 개발 단계라 update, 운영 넘어가면 validate로 변경 권장
    show-sql: true          # 저장되는 SQL을 콘솔에서 직접 보기 위함 (테스트용)
    properties:
      hibernate:
        format_sql: true

jwt:
  # HS256 알고리즘 사용을 위해 최소 32자(256비트) 이상의 문자열 필요
  secret: your-lawchat-secret-key-must-be-at-least-32-characters-long-123456
  expiration-millis: 86400000          # 24시간 (1일 = 86,400,000 ms)
  refresh-expiration-millis: 604800000 # 7일 (필요 시)

ai:
  legal-chatbot:
    base-url: http://13.217.199.103:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 60000

law-api:
  oc: 202608110004094829
  base-url: http://www.law.go.kr/DRF
  sync:
    enabled-on-startup: true
    cron: "0 0 3 * * *"