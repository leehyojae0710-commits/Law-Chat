server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: backend
  datasource:
    # connectionTimeZone 대신 serverTimezone=Asia/Seoul 사용 (+09:00 호환)
    url: jdbc:mysql://192.168.0.197:3306/law_chat?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  sql:
    init:
      mode: never

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

file:
  upload-dir: \\192.168.0.229\uploads\2차\images

# ==========================================
# JWT Token Settings
# ==========================================
jwt:
  secret: ${JWT_SECRET}
  # Access Token: 15분 (15 * 60 * 1000 = 900,000 ms)
  access-expiration-millis: ${JWT_ACCESS_EXPIRATION:900000}
  # 기존 expiration-millis 호환용 (15분)
  expiration-millis: ${JWT_EXPIRATION:900000}
  # Refresh Token: 7일 (7 * 24 * 60 * 60 * 1000 = 604,800,000 ms)
  refresh-expiration-millis: ${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# OAuth Social Login Settings
# ==========================================
oauth:
  kakao:
    # [1] REST API 키 (공개 식별자 - 그 자체로는 민감하지 않지만 팀 공용 값이라 .env로 관리)
    client-id: ${KAKAO_CLIENT_ID}
    # [2] Client Secret (서버 비밀값)
    client-secret: ${KAKAO_CLIENT_SECRET}
    # [3] Redirect URI
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/kakao/oauth}

  naver:
    # [1] Client ID (공개 식별자)
    client-id: ${NAVER_CLIENT_ID}
    # [2] Client Secret (서버 비밀값)
    client-secret: ${NAVER_CLIENT_SECRET}
    # [3] Callback URL
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/naver/oauth}
    state-validation-enabled: ${NAVER_STATE_VALIDATION_ENABLED:true}
    
# ==========================================
# External Service & Domain Settings
# ==========================================
ai:
  legal-chatbot:
    base-url: http://54.82.68.195:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 600000

law-api:
  oc: "202608110004094829"
  base-url: http://www.law.go.kr/DRF
  sync:
    enabled-on-startup: true
    startup-max-pages: 4000   # 필요하면 늘리세요
    cron: "0 0 3 * * *"

user:
  withdrawal:
    retention-days: ${WITHDRAWAL_RETENTION_DAYS:180}

# ==========================================
# Logging
# ==========================================
logging:
  level:
    com.lawchat: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace