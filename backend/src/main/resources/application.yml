spring:
  application:
    name: lawchat-api

  datasource:
    # MySQL 8 기준. serverTimezone 을 지정하지 않으면 timestamp 값이 9시간 틀어질 수 있다.
    url: jdbc:mysql://localhost:3306/lawchat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ★ schema.sql 로 테이블을 이미 만들었으므로 create/update 를 쓰면 안 된다.
      #   validate : 엔티티와 실제 테이블이 맞는지 기동 시 검사만 한다(불일치면 기동 실패 → 오타를 조기에 발견).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 기본값이 이미 MySQL 방언을 자동 감지하므로 dialect 를 명시할 필요는 없다.
    open-in-view: false
    # open-in-view=false 로 두는 이유:
    #  true(기본값)면 영속성 컨텍스트가 View 렌더링까지 열려 있어
    #  컨트롤러에서 의도치 않은 지연로딩 쿼리가 나가고 DB 커넥션도 오래 붙잡는다.

  jackson:
    # null 필드를 응답 JSON 에서 제외해 페이로드를 줄인다
    default-property-inclusion: non_null

jwt:
  # ★ 실제 배포 시에는 반드시 환경변수로 주입할 것. 소스에 하드코딩 금지.
  #   HS256 은 32byte 이상 키가 필요하므로 최소 32자 이상 영문/숫자로 설정한다.
  secret: ${JWT_SECRET:lawchat-local-dev-secret-key-change-me-1234567890}
  # 액세스 토큰 유효시간: 1시간 (밀리초)
  expiration-millis: 3600000

# ==================================================================
# ★★★ 카카오 로그인 키를 넣는 곳 ★★★
# ==================================================================
# 아래 ${ } 안의 값은 "환경변수 이름 : 기본값" 형식이다.
#   - 환경변수가 있으면 그 값을,
#   - 없으면 콜론(:) 뒤의 기본값을 사용한다.
#
# 로컬 개발: 콜론 뒤에 직접 넣어도 되지만, 이 파일은 깃에 올라가므로
#           application-local.yml 로 분리하고 .gitignore 에 넣는 것을 권장한다.
# 운영 배포: 반드시 환경변수(또는 AWS Parameter Store)로 주입할 것.
# ==================================================================
oauth:
  kakao:
    # [1] REST API 키  — 공개돼도 되는 값 (앱 식별자)
    #     위치: 카카오 개발자센터 > 내 애플리케이션 > 앱 설정 > 앱 키 > REST API 키
    client-id: ${KAKAO_CLIENT_ID:여기에_REST_API_키}

    # [2] 클라이언트 시크릿  — ★서버만 알아야 하는 비밀값★
    #     위치: 내 애플리케이션 > 제품 설정 > 카카오 로그인 > 보안 > Client Secret
    #     "코드 생성" 후 아래 활성화 상태를 [사용함] 으로 바꿔야 적용된다.
    #     최근 생성한 앱은 이 기능이 기본 활성화되어 있어, 값을 안 보내면 KOE010 에러가 난다.
    #     ※ 이 값은 인가코드 -> 토큰 교환(검증) 요청에서만 사용된다. 프론트로 절대 내려보내지 말 것.
    client-secret: ${KAKAO_CLIENT_SECRET:여기에_CLIENT_SECRET}

    # [3] Redirect URI — 개발자센터에 등록한 값과 문자 하나까지 동일해야 함 (다르면 KOE006)
    #     위치: 내 애플리케이션 > 제품 설정 > 카카오 로그인 > Redirect URI
    #     (개편된 화면에서는 [앱] > [플랫폼 키] > [REST API 키] > [리다이렉트 URI])
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao}

logging:
  level:
    com.lawchat: debug
    # 실행되는 SQL 을 보고 싶을 때 (운영에서는 끌 것)
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080
