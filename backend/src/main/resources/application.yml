spring:
  application:
    name: lawchat-api

  datasource:
    # ★ MySQL 8 / Connector-J 9 기준 접속 URL
    #   - characterEncoding=UTF-8 + useUnicode=true
    #       Connector-J 는 이 값을 utf8mb4 로 해석한다. schema.sql 의
    #       DEFAULT CHARSET=utf8mb4 와 맞아떨어져 한글/이모지가 깨지지 않는다.
    #   - connectionTimeZone=Asia/Seoul (구 serverTimezone. 8.0.23 부터 이 이름이 정식)
    #       + forceConnectionTimeZoneToSession=true
    #       모든 컬럼이 timestamp 인데, MySQL timestamp 는 내부적으로 UTC 로 저장하고
    #       "세션 타임존"으로 변환해 돌려준다. 세션 타임존을 못 박지 않으면
    #       created_at 이 9시간 틀어져 보인다.
    #   - allowPublicKeyRetrieval=true
    #       MySQL 8 기본 인증 플러그인(caching_sha2_password) + useSSL=false 조합에서
    #       이게 없으면 "Public Key Retrieval is not allowed" 로 접속이 아예 안 된다.
    url: jdbc:mysql://192.168.0.197:3306/law_chat?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:team}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ★ create / update 는 절대 쓰지 말 것 (운영 테이블이 날아가거나 멋대로 변형된다).
      #
      #   none     : 스키마에 손도 대지 않고 검사도 하지 않는다. ← 현재 설정
      #   validate : 기동 시 엔티티 <-> 테이블 일치 여부를 검사한다.
      #
      #   이 프로젝트는 schema.sql 이 정본(source of truth)이고, 그 안에
      #   MySQL 고유 타입(enum, json, text)이 섞여 있다. Hibernate 의 validate 는
      #   이런 타입을 JDBC 타입코드로만 비교하기 때문에
      #     users.status         enum(...)  -> found [enum (Types#CHAR)], expecting [varchar]
      #     chat_messages.sources json      -> found [json], expecting [varchar]
      #   같은 "실제로는 멀쩡한데 기동만 막는" 오탐이 난다.
      #   그래서 기본값을 none 으로 두었다.
      #
      #   컬럼명 오타를 한 번 훑고 싶을 때만 잠깐 validate 로 바꿔 확인하고 되돌리면 된다.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # ★ 위 connectionTimeZone 과 반드시 같은 값으로 맞춘다.
          #   여기만 비워두면 Hibernate 는 JVM 기본 타임존으로 LocalDateTime 을 바인딩해서
          #   DB 세션 타임존과 어긋나고, 결국 시각이 밀린다.
          time_zone: Asia/Seoul
        # 기본값이 이미 MySQL 방언을 자동 감지하므로 dialect 를 명시할 필요는 없다.
    open-in-view: false
    # open-in-view=false 로 두는 이유:
    #  true(기본값)면 영속성 컨텍스트가 View 렌더링까지 열려 있어
    #  컨트롤러에서 의도치 않은 지연로딩 쿼리가 나가고 DB 커넥션도 오래 붙잡는다.

  # ★★★ DB 스키마 보호 ★★★
  # 애플리케이션이 DDL 을 단 한 줄도 실행하지 못하게 이중으로 막는다.
  #  - jpa.hibernate.ddl-auto: none -> Hibernate 가 테이블을 만들거나 바꾸지 않는다
  #  - sql.init.mode: never         -> 클래스패스의 schema.sql / data.sql 을 실행하지 않는다
  # 테이블은 이미 만들어져 있는 것을 그대로 쓴다. 스키마는 이 앱이 관리하지 않는다.
  sql:
    init:
      mode: never

  jackson:
    # null 필드를 응답 JSON 에서 제외해 페이로드를 줄인다
    default-property-inclusion: non_null

jwt:
  # ★ 실제 배포 시에는 반드시 환경변수로 주입할 것. 소스에 하드코딩 금지.
  #   HS256 은 32byte 이상 키가 필요하므로 최소 32자 이상 영문/숫자로 설정한다.
  secret: ${JWT_SECRET:lawchat-local-dev-secret-key-change-me-1234567890}
  # 액세스 토큰 유효시간: 1시간 (밀리초)
  expiration-millis: 3600000

# ==================================================================
# ★★★ 카카오 로그인 키를 넣는 곳 ★★★
# ==================================================================
# 아래 ${ } 안의 값은 "환경변수 이름 : 기본값" 형식이다.
#   - 환경변수가 있으면 그 값을,
#   - 없으면 콜론(:) 뒤의 기본값을 사용한다.
#
# 로컬 개발: 콜론 뒤에 직접 넣어도 되지만, 이 파일은 깃에 올라가므로
#           application-local.yml 로 분리하고 .gitignore 에 넣는 것을 권장한다.
# 운영 배포: 반드시 환경변수(또는 AWS Parameter Store)로 주입할 것.
# ==================================================================
oauth:
  kakao:
    # [1] REST API 키  — 공개돼도 되는 값 (앱 식별자)
    #     위치: 카카오 개발자센터 > 내 애플리케이션 > 앱 설정 > 앱 키 > REST API 키
    client-id: ${KAKAO_CLIENT_ID:264b3934317b0bdf9e0264a0b9b831e1}

    # [2] 클라이언트 시크릿  — ★서버만 알아야 하는 비밀값★
    #     위치: 내 애플리케이션 > 제품 설정 > 카카오 로그인 > 보안 > Client Secret
    #     "코드 생성" 후 아래 활성화 상태를 [사용함] 으로 바꿔야 적용된다.
    #     최근 생성한 앱은 이 기능이 기본 활성화되어 있어, 값을 안 보내면 KOE010 에러가 난다.
    #     ※ 이 값은 인가코드 -> 토큰 교환(검증) 요청에서만 사용된다. 프론트로 절대 내려보내지 말 것.
    client-secret: ${KAKAO_CLIENT_SECRET:여기에_CLIENT_SECRET}

    # [3] Redirect URI — 개발자센터에 등록한 값과 문자 하나까지 동일해야 함 (다르면 KOE006)
    #     위치: 내 애플리케이션 > 제품 설정 > 카카오 로그인 > Redirect URI
    #     (개편된 화면에서는 [앱] > [플랫폼 키] > [REST API 키] > [리다이렉트 URI])
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/kakao/oauth}

  naver:
    # [1] Client ID — 공개돼도 되는 앱 식별자
    #     위치: 네이버 개발자센터 > Application > 내 애플리케이션 > 애플리케이션 정보
    client-id: ${NAVER_CLIENT_ID:86rGzZDmkleqP77UeWS3}

    # [2] Client Secret — ★서버만 알아야 하는 비밀값★
    #     같은 화면에서 확인. 카카오와 달리 네이버는 처음부터 필수값이다.
    client-secret: ${NAVER_CLIENT_SECRET:여기에_NAVER_CLIENT_SECRET}

    # [3] Callback URL — 개발자센터 [API 설정 > 로그인 오픈 API 서비스 환경]에
    #     등록한 값과 문자 하나까지 동일해야 함 (다르면 invalid_request)
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/naver/oauth}

ai:
  legal-chatbot:
    base-url: ${AI_LEGAL_CHATBOT_BASE_URL:http://<EC2 퍼블릭IP 또는 도메인>:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 60000

logging:
  level:
    com.lawchat: debug
    # 실행되는 SQL 을 보고 싶을 때 (운영에서는 끌 것)
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080

  # ★ HTTP 응답 인코딩을 UTF-8 로 고정.
  #   Boot 4 기본값도 UTF-8 이지만, force: true 를 주면 컨트롤러가 Content-Type 에
  #   charset 을 빠뜨려도 서버가 강제로 붙여준다. (브라우저가 EUC-KR 로 오해하는 것 방지)
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
